name: CI-Check

on:
  push:
    branches: [ main, epic/** ]
  pull_request:
    branches: [ main, epic/** ]

jobs:
  validate_source_branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Validate the PR is coming from an epic/ branch
        run: |
          if [[ ! "${{ github.head_ref }}" =~ ^epic/ ]]; then
            echo "❌ Only epic/* branches can make a PR to main."
            echo "   This PR is coming from: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ Valid PR: ${{ github.head_ref }} → main"

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # clones repo
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # generates types before validating TS
      - name: Generate Nuxt Types
        run: npx nuxi prepare

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Run Unit and Integration Tests
        run: npm run test:run