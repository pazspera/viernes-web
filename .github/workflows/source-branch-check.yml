name: Check Source Branch
on:
  pull_request:
    branches: [ main ]

jobs:
  check_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checks the PR is coming from a epic/* branch
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != epic/* ]]; then
            echo "You can PR to main only from a epic/* branch"
            exit 1
          fi